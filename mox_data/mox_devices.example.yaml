# Example Mox device list.
#
# Copy this file to mox_devices.yaml in the same folder and replace the
# entries with your own devices. In the AppDaemon add-on the file goes to
#   /config/mox_data/mox_devices.yaml
# (two folders up from apps/mox, then mox_data/). To keep it somewhere else,
# set the MOX_DEVICES_FILE environment variable to its full path.
#
# Each device maps a Home Assistant helper to one Mox controller output:
#   name:       helper entity name, without the domain.
#               input_boolean.<name> for on/off devices,
#               input_number.<name> for curtains.
#   controller: Mox controller number (as configured in the Mox system).
#   port:       output on that controller, 17-24.
#   input_type: input_boolean (on/off) or input_number (curtain, 0-100).
#
# Optional fields, used only by the mox_mqtt app (see the README):
#   kind:       how an on/off device appears in Home Assistant: light, fan or
#               switch (the default). Curtains always appear as covers.
#   title:      the device name in Home Assistant (default: the helper's name).
#   icon:       an icon such as 'mdi:air-conditioner'.
#
# Rules (checked when the apps load; a bad entry stops them with an error
# naming it):
#   - name, controller, port and input_type are required
#   - names must be unique
#   - each controller/port pair can be used only once
#
# Every name listed here needs a matching helper in Home Assistant
# (see config/configuration.yaml for examples).
#
# Changes are picked up within 30 seconds, without restarting AppDaemon. If the
# edited file has an error, mox.log says so and the previous list stays in use.

# Optional: the Mox gateway address. Leave it out to use these defaults.
# Changing listen_port needs an AppDaemon restart; the others apply on reload.
gateway:
  ip: 172.16.254.254   # Mox gateway IP
  port: 6670           # UDP port the gateway listens on
  listen_port: 6666    # UDP port the gateway sends status replies to

devices:
  # Controller 200 - on/off outputs
  - {name: entrance, controller: 200, port: 17, input_type: input_boolean, kind: light}
  - {name: entrance_stairs, controller: 200, port: 18, input_type: input_boolean}
  - {name: parents_light, controller: 200, port: 19, input_type: input_boolean, kind: light, title: Parents light}
  - {name: parents_fan, controller: 200, port: 20, input_type: input_boolean, kind: fan}
  - {name: parents_ac, controller: 200, port: 21, input_type: input_boolean, icon: 'mdi:air-conditioner'}

  # Controller 201 - on/off outputs
  - {name: office_light, controller: 201, port: 17, input_type: input_boolean, kind: light}
  - {name: office_fan, controller: 201, port: 18, input_type: input_boolean, kind: fan}
  - {name: kitchen_table_light, controller: 201, port: 19, input_type: input_boolean}
  - {name: parents_boiler, controller: 201, port: 20, input_type: input_boolean}

  # Controller 401 - curtain outputs (position 0-100, 100 = open)
  - {name: living_room_curtain, controller: 401, port: 17, input_type: input_number}
  - {name: office_curtain, controller: 401, port: 18, input_type: input_number}

  # A device you want to keep listed but not control: comment it out.
  # - {name: old_garden_light, controller: 201, port: 24, input_type: input_boolean}

# Optional: names of devices that also have another control (for example an
# ESPHome relay). Loaded but not used by the apps yet.
esp_devices:
  - kitchen_table_light
